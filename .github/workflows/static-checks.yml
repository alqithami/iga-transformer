name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --upgrade pip PyYAML

      - name: Run static checks
        run: bash scripts/static_check.sh

      - name: Check published error-transition analysis
        run: python -m unittest discover -s tests -p 'test_error_transitions_publication.py' -v
